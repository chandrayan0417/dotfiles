# --- Mouse support ---
set -g mouse on

# --- Window title ---
setw -g window-status-format '#[fg=#cdd6f4,bg=#313244] #W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #W '

# --- Focus events ---
set -g focus-events on
set -s escape-time 0

# --- Status bar ---
set -g status-style bg=default
set -g status-left-length 0
set -g status-right-length 0
set -g status-justify absolute-centre
set -g status-left '#[fg=black,bg=green,bold] #S #[default]#[fg=magenta] | '

# --- Prefix key ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Reload config ---
unbind r
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# --- Pane movement ---
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind z resize-pane -Z

# --- Pane resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Split panes in same dir ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- True color + UTF-8 ---
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

# --- Auto rename windows ---
setw -g automatic-rename on
set-option -g allow-rename off

# --- Scrollback limit ---
set -g history-limit 10000

# --- Start index at 1 ---
set -g base-index 1
set -g pane-base-index 1

# --- Quick window select ---
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# --- Session switcher ---
bind Space display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# --- Tmux Plugin Manager ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'  # save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto restore
run ~/.config/tmux/plugins/tpm/tpm
